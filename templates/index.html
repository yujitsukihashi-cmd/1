<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cool Girl Companion</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">

    <div class="view" id="view-list">
      <div class="list-header">
        <p class="eyebrow">Cool Girl NFT &middot; Companion</p>
        <h1>誰とお話しする?</h1>
        <p>87人のCool Girlから、気になる子をタップしてね。Claude(<code>claude-sonnet-5</code>)が本人になりきって返信します。</p>
      </div>
      <div class="search-row">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="roster-search" type="text" placeholder="番号やHOBBYで検索" autocomplete="off">
        </div>
      </div>
      <div class="roster" id="roster"></div>
    </div>

    <div class="view hidden" id="view-chat">
      <div class="chat-layout">
        <div class="portrait-pane">
          <div class="portrait-toprow">
            <button class="back-btn" id="back-btn" aria-label="戻る">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              <span>一覧に戻る</span>
            </button>
            <button class="voice-toggle-btn" id="voice-toggle" aria-label="音声読み上げ ON">
              <svg class="icon-on" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
              <svg class="icon-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            </button>
          </div>
          <div class="portrait-frame" id="portrait-frame">
            <img class="portrait-img" id="chat-avatar" src="" alt="">
            <span class="you-chip" id="chat-you-chip" style="display:none">YOU</span>
            <span class="mood-badge" id="mood-badge"></span>
          </div>
          <div class="portrait-info">
            <p class="chat-name" id="chat-name"></p>
            <p class="chat-hobby" id="chat-hobby"></p>
          </div>
        </div>
        <div class="chat-pane">
          <div class="thread" id="thread"></div>
          <div class="composer">
            <button class="mic-btn" id="mic-btn" aria-label="音声入力" title="音声入力">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <input id="msg-input" type="text" placeholder="メッセージを送る…" autocomplete="off">
            <button class="send-btn" id="send-btn" aria-label="送信">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
          <p class="disclaimer">Claude API (claude-sonnet-5) でリアルタイム生成しています。実在の設定・意見ではなく、キャラクターとしての創作応答です。音声読み上げはVOICEVOX、音声入力はブラウザ標準機能(Web Speech API)を使用しています。</p>
        </div>
      </div>
    </div>

  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
